<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="200" r="180" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="950" cy="300" r="220" fill="#8b5cf6" opacity="0.18" filter="url(#glow)"/>
  <circle cx="600" cy="650" r="250" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 100 H1200 M0 200 H1200 M0 300 H1200 M0 400 H1200 M0 500 H1200 M0 600 H1200 M0 700 H1200"/>
    <path d="M100 0 V800 M200 0 V800 M300 0 V800 M400 0 V800 M500 0 V800 M600 0 V800 M700 0 V800 M800 0 V800 M900 0 V800 M1000 0 V800 M1100 0 V800"/>
  </g>

  <!-- Main IDE Window (Center-Left) -->
  <g transform="translate(100, 140)">
    <!-- Window Shadow & Frame -->
    <rect width="640" height="480" rx="14" fill="url(#codeGrad)" stroke="#334155" stroke-width="1.5" filter="drop-shadow(0 25px 35px rgba(0,0,0,0.6))"/>
    
    <!-- Title Bar -->
    <path d="M0 14 C0 6.268 6.268 0 14 0 H626 C633.732 0 640 6.268 640 14 V42 H0 Z" fill="#0f172a" stroke="#334155" stroke-width="0.5"/>
    <circle cx="24" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="60" cy="21" r="5.5" fill="#10b981"/>
    <text x="320" y="26" fill="#94a3b8" font-family="monospace" font-size="12" text-anchor="middle">App.tsx — MouseToClick Cloud Engine</text>

    <!-- Tab Bar -->
    <rect x="0" y="42" width="160" height="32" fill="#1e293b"/>
    <text x="45" y="63" fill="#60a5fa" font-family="monospace" font-size="12" font-weight="bold">index.tsx</text>
    <rect x="161" y="42" width="140" height="32" fill="#0f172a"/>
    <text x="195" y="63" fill="#64748b" font-family="monospace" font-size="12">styles.css</text>

    <!-- Code Content -->
    <g transform="translate(30, 105)" font-family="Consolas, monospace" font-size="13" line-height="24">
      <text y="0"><tspan fill="#ec4899">import</tspan> <tspan fill="#f8fafc">{ useState, useEffect }</tspan> <tspan fill="#ec4899">from</tspan> <tspan fill="#34d399">&apos;react&apos;</tspan>;</text>
      <text y="28"><tspan fill="#ec4899">import</tspan> <tspan fill="#f8fafc">{ createNextApp }</tspan> <tspan fill="#ec4899">from</tspan> <tspan fill="#34d399">&apos;@mousetoclick/core&apos;</tspan>;</text>
      
      <text y="70"><tspan fill="#60a5fa">export function</tspan> <tspan fill="#fbbf24">EnterprisePortal</tspan>() {</text>
      <text y="98" x="20"><tspan fill="#60a5fa">const</tspan> [<tspan fill="#f8fafc">performance</tspan>, <tspan fill="#f8fafc">setOpt</tspan>] = <tspan fill="#a78bfa">useState</tspan>(<tspan fill="#38bdf8">100</tspan>);</text>
      <text y="126" x="20"><tspan fill="#64748b">// Modern cloud-native infrastructure</tspan></text>
      <text y="154" x="20"><tspan fill="#ec4899">return</tspan> (</text>
      <text y="182" x="40"><tspan fill="#60a5fa">&lt;</tspan><tspan fill="#38bdf8">CloudServiceArchitecture</tspan></text>
      <text y="210" x="60"><tspan fill="#93c5fd">uptime</tspan>=<tspan fill="#34d399">&quot;99.99%&quot;</tspan> <tspan fill="#93c5fd">scalable</tspan>=<tspan fill="#a78bfa">{true}</tspan></text>
      <text y="238" x="60"><tspan fill="#93c5fd">stack</tspan>=<tspan fill="#34d399">&quot;Next.js + TypeScript + Cloud&quot;</tspan></text>
      <text y="266" x="40"><tspan fill="#60a5fa">/&gt;</tspan></text>
      <text y="294" x="20">);</text>
      <text y="322">}</text>
    </g>

    <!-- Status Bar -->
    <rect x="0" y="456" width="640" height="24" fill="#3b82f6"/>
    <text x="20" y="472" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">READY • TypeScript 5.7 • Next.js 14 • 0 Errors</text>
  </g>

  <!-- Interactive Device Mockups & Preview Cards (Right Side) -->
  <!-- Browser Window Mockup -->
  <g transform="translate(680, 100)">
    <rect width="440" height="340" rx="14" fill="#0b1329" stroke="#3b82f6" stroke-width="1.5" filter="drop-shadow(0 20px 30px rgba(59,130,246,0.25))"/>
    
    <!-- Browser Top Bar -->
    <path d="M0 14 C0 6.268 6.268 0 14 0 H426 C433.732 0 440 6.268 440 14 V40 H0 Z" fill="#1e293b"/>
    <circle cx="20" cy="20" r="4.5" fill="#ef4444"/>
    <circle cx="34" cy="20" r="4.5" fill="#f59e0b"/>
    <circle cx="48" cy="20" r="4.5" fill="#10b981"/>
    
    <!-- Search Bar -->
    <rect x="75" y="10" width="280" height="20" rx="10" fill="#0f172a"/>
    <text x="215" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">https://mousetoclick.com/app</text>

    <!-- Browser Content (Dashboard Preview) -->
    <g transform="translate(25, 60)">
      <!-- Metric Cards -->
      <rect x="0" y="0" width="115" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="12" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Page Speed</text>
      <text x="12" y="48" fill="#10b981" font-family="sans-serif" font-size="20" font-weight="bold">99 / 100</text>

      <rect x="135" y="0" width="115" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="147" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Response SLA</text>
      <text x="147" y="48" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold">&lt; 120ms</text>

      <rect x="270" y="0" width="120" height="65" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="282" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">SEO Score</text>
      <text x="282" y="48" fill="#a855f7" font-family="sans-serif" font-size="20" font-weight="bold">100%</text>

      <!-- Chart Simulation -->
      <rect x="0" y="85" width="390" height="150" rx="8" fill="#131c31" stroke="#334155" stroke-width="1"/>
      <text x="15" y="110" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Traffic &amp; Conversion Analytics</text>
      
      <!-- Graph Line -->
      <polyline points="20,200 70,180 120,195 180,140 240,160 300,120 370,100" fill="none" stroke="url(#accentGrad)" stroke-width="3" filter="url(#softGlow)"/>
      <circle cx="370" cy="100" r="5" fill="#60a5fa"/>
    </g>
  </g>

  <!-- Mobile Device Mockup (Overlapping Front-Right) -->
  <g transform="translate(870, 360)">
    <rect width="210" height="340" rx="24" fill="#0f172a" stroke="#6366f1" stroke-width="2" filter="drop-shadow(0 25px 40px rgba(0,0,0,0.8))"/>
    
    <!-- Notch -->
    <rect x="65" y="8" width="80" height="12" rx="6" fill="#020617"/>
    
    <!-- Mobile App Header -->
    <rect x="15" y="35" width="180" height="40" rx="8" fill="#1e293b"/>
    <text x="30" y="58" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold">Web Solutions</text>
    
    <!-- Mobile Items -->
    <rect x="15" y="85" width="180" height="45" rx="8" fill="#1e293b" opacity="0.9"/>
    <circle cx="35" cy="107" r="10" fill="#3b82f6"/>
    <rect x="55" y="100" width="110" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="55" y="112" width="70" height="4" rx="2" fill="#64748b"/>

    <rect x="15" y="140" width="180" height="45" rx="8" fill="#1e293b" opacity="0.9"/>
    <circle cx="35" cy="162" r="10" fill="#10b981"/>
    <rect x="55" y="155" width="100" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="55" y="167" width="80" height="4" rx="2" fill="#64748b"/>

    <rect x="15" y="195" width="180" height="45" rx="8" fill="#1e293b" opacity="0.9"/>
    <circle cx="35" cy="217" r="10" fill="#f59e0b"/>
    <rect x="55" y="210" width="120" height="6" rx="3" fill="#cbd5e1"/>
    <rect x="55" y="222" width="60" height="4" rx="2" fill="#64748b"/>
    
    <!-- Mobile Floating CTA -->
    <rect x="25" y="270" width="160" height="35" rx="10" fill="url(#accentGrad)"/>
    <text x="105" y="292" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Launch Website</text>
  </g>

  <!-- Floating Tech Badges -->
  <g transform="translate(480, 560)">
    <rect width="210" height="50" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" filter="drop-shadow(0 10px 20px rgba(0,0,0,0.5))"/>
    <text x="25" y="31" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">&lt;/&gt;</text>
    <text x="60" y="25" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">Full-Stack Delivery</text>
    <text x="60" y="40" fill="#94a3b8" font-family="sans-serif" font-size="10">Next.js • React • APIs</text>
  </g>

  <!-- Bottom Brand Watermark Banner -->
  <g transform="translate(100, 680)">
    <text x="0" y="0" fill="#ffffff" font-family="sans-serif" font-size="28" font-weight="800" letter-spacing="1">
      WEB DEVELOPMENT &amp; CLOUD APPS
    </text>
    <text x="0" y="24" fill="#60a5fa" font-family="sans-serif" font-size="14" font-weight="600" letter-spacing="2">
      FAST. RESPONSIVE. HIGH CONVERTING.
    </text>
  </g>
</svg>
